name: Build KurierX Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, например 2.4.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > kurierx-release.jks

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1,$2,$3}')
          sed -i -E "s/versionCode = [0-9]+/versionCode = $CODE/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$VERSION\"/" app/build.gradle.kts

      - name: Build release APK
        env:
          KX_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/kurierx-release.jks" \
            -Pandroid.injected.signing.store.password="$KX_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KX_KEY_PASSWORD"

      - name: Prepare APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "KurierX-${{ inputs.version }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            "KurierX-${{ inputs.version }}.apk" \
            --title "KurierX v${{ inputs.version }}" \
            --notes "KurierX v${{ inputs.version }}"